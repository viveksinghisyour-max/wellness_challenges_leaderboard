<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wellness Calculation Test Suite</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .test-suite-container {
      max-width: 900px;
      margin: 2rem auto;
      padding: 1.5rem;
      background: #fff;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-md);
    }
    .test-summary-box {
      display: flex;
      gap: 1.5rem;
      padding: 1rem 1.5rem;
      border-radius: var(--radius-md);
      margin-bottom: 1.5rem;
      font-weight: 700;
    }
    .test-pass-bg { background-color: #ecfdf5; border: 1px solid #a7f3d0; color: #065f46; }
    .test-fail-bg { background-color: #fef2f2; border: 1px solid #fecaca; color: #991b1b; }
    .test-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border-light);
      font-size: 0.9rem;
    }
    .test-item:last-child { border-bottom: none; }
    .test-status { font-weight: 700; border-radius: var(--radius-full); padding: 0.2rem 0.6rem; font-size: 0.8rem; }
    .test-pass { background-color: #d1fae5; color: #065f46; }
    .test-fail { background-color: #fee2e2; color: #991b1b; }
    .test-cat-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin: 1.5rem 0 0.75rem;
      padding-bottom: 0.35rem;
      border-bottom: 2px solid var(--primary-light);
      color: var(--primary-dark);
    }
  </style>
</head>
<body style="background:var(--bg-app); min-height:100vh;">

  <div class="test-suite-container">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
      <div>
        <h1 style="font-size:1.6rem; font-weight:800; color:var(--text-primary); margin-bottom:0.25rem;">
          Wellness Engine Test Suite
        </h1>
        <p style="color:var(--text-secondary); font-size:0.9rem;">
          Automated unit tests validating deterministic scoring, anti-cheat detection, storage deduplication, and math edge cases.
        </p>
      </div>
      <a href="index.html" class="btn btn-outline btn-sm">&larr; Return to Dashboard</a>
    </div>

    <!-- Summary Box -->
    <div id="test-summary" class="test-summary-box test-pass-bg">
      <div>Running automated tests...</div>
    </div>

    <!-- Results Groups -->
    <div id="test-results-container"></div>
  </div>

  <!-- Scripts to Test -->
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/scoring.js"></script>
  <script src="js/anomaly-detection.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/challenges.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/leaderboard.js"></script>

  <!-- Standalone Lightweight Test Runner -->
  <script>
    (function () {
      'use strict';

      const results = [];
      let currentCategory = 'General';

      function category(name) {
        currentCategory = name;
      }

      function test(description, fn) {
        try {
          fn();
          results.push({ category: currentCategory, description, passed: true });
        } catch (err) {
          results.push({ category: currentCategory, description, passed: false, error: err.message });
        }
      }

      function assert(condition, message) {
        if (!condition) throw new Error(message || 'Assertion failed');
      }

      function assertEqual(actual, expected, message) {
        if (actual !== expected) {
          throw new Error(`${message ? message + ': ' : ''}Expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`);
        }
      }

      // --- RUN TESTS ---

      // 1. Scoring Engine Tests
      category('1. Deterministic Scoring Logic');

      test('Calculates standard daily steps correctly (10,000 steps = 100 pts)', () => {
        const score = window.WellnessScoring.calculateDailyScore({ steps: 10000, activeMinutes: 0, water: 0, sleep: 0 });
        assertEqual(score, 100, '10,000 steps should yield 100 points');
      });

      test('Enforces daily steps cap (40,000 steps capped at 300 pts)', () => {
        const score = window.WellnessScoring.calculateDailyScore({ steps: 40000, activeMinutes: 0, water: 0, sleep: 0 });
        assertEqual(score, 300, '40,000 steps must cap at 300 points');
      });

      test('Calculates active minutes points (45 mins * 2 = 90 pts)', () => {
        const score = window.WellnessScoring.calculateDailyScore({ steps: 0, activeMinutes: 45, water: 0, sleep: 0 });
        assertEqual(score, 90, '45 active minutes should yield 90 points');
      });

      test('Calculates hydration and sleep points correctly', () => {
        // 8 glasses = 80 pts, 8 hours sleep = 80 pts -> Total = 160 pts
        const score = window.WellnessScoring.calculateDailyScore({ steps: 0, activeMinutes: 0, water: 8, sleep: 8 });
        assertEqual(score, 160, '8 glasses + 8 hrs sleep should yield 160 points');
      });

      test('Challenge completion bonus adds exactly 250 points per challenge', () => {
        const activities = [
          { id: 't1', date: '2026-10-29', type: 'steps', value: 10000 }
        ];
        const enrollments = [
          { challengeId: 'c1', completed: true },
          { challengeId: 'c2', completed: true }
        ];
        const scoreObj = window.WellnessScoring.computeCurrentUserScore(activities, enrollments, { streakDays: 0 });
        assertEqual(scoreObj.challengeBonus, 500, '2 completed challenges should yield 500 bonus points');
      });

      test('Deterministic tie-breaker correctly compares scores and tie-breaking metrics', () => {
        const pA = { name: 'Alice', score: 2000, completedChallenges: 3, activeMinutes: 300, steps: 60000 };
        const pB = { name: 'Bob', score: 2000, completedChallenges: 4, activeMinutes: 200, steps: 50000 };
        // Bob has 4 completed challenges vs Alice's 3, so Bob should rank ahead (comparison should be > 0 if a compares to b)
        const diff = window.WellnessScoring.compareParticipants(pA, pB);
        assert(diff > 0, 'Bob should rank ahead of Alice because of higher completed challenges');
      });

      // 2. Anomaly Detection Tests
      category('2. Anti-Cheat Anomaly Detection Engine');

      test('Flags extreme daily steps (>55,000) as high severity anomaly', () => {
        const mockParticipant = {
          id: 'test_p1',
          name: 'Fast Dave',
          dailyActivities: [{ date: '2026-10-29', steps: 62000, activeMinutes: 60, sleep: 8 }]
        };
        const report = window.WellnessAnomaly.inspectParticipantActivities(mockParticipant);
        assert(report.isAnomaly, 'Should flag 62,000 steps as an anomaly');
        assertEqual(report.severity, 'high', 'Severity must be high');
        assertEqual(report.status, 'Requires Review', 'Status must be Requires Review');
      });

      test('Flags impossible step cadence (>300 steps/min) as high severity anomaly', () => {
        const mockParticipant = {
          id: 'test_p2',
          name: 'Sprint Bot',
          dailyActivities: [{ date: '2026-10-29', steps: 28000, activeMinutes: 20, sleep: 8 }]
        };
        const report = window.WellnessAnomaly.inspectParticipantActivities(mockParticipant);
        assert(report.isAnomaly, 'Should flag 28k steps in 20 mins as an anomaly');
        assertEqual(report.severity, 'high', 'Cadence anomaly must be high severity');
      });

      test('Approves realistic human wellness records as Normal', () => {
        const mockParticipant = {
          id: 'test_p3',
          name: 'Normal Walker',
          dailyActivities: [
            { date: '2026-10-28', steps: 9500, activeMinutes: 40, water: 8, sleep: 7.5 },
            { date: '2026-10-29', steps: 10200, activeMinutes: 45, water: 8, sleep: 8.0 }
          ]
        };
        const report = window.WellnessAnomaly.inspectParticipantActivities(mockParticipant);
        assert(!report.isAnomaly, 'Realistic activity must NOT be flagged as anomaly');
        assertEqual(report.status, 'Normal');
      });

      // 3. Storage and Deduplication Tests
      category('3. Storage & Deduplication');

      test('Deduplication prevents counting duplicate record IDs twice', () => {
        const activities = [
          { id: 'rec_same_01', date: '2026-10-29', type: 'steps', value: 8000 },
          { id: 'rec_same_01', date: '2026-10-29', type: 'steps', value: 8000 } // Duplicate ID
        ];
        const dayMap = window.WellnessScoring.aggregateActivitiesByDay(activities);
        assertEqual(dayMap['2026-10-29'].steps, 8000, 'Duplicate record ID must be ignored');
      });

      test('Duplicate challenge enrollment is prevented by storage API', () => {
        window.WellnessStorage.enrollChallenge('test-ch-01');
        const res = window.WellnessStorage.enrollChallenge('test-ch-01');
        assertEqual(res.success, false, 'Enrolling in an already enrolled challenge must return false');
        window.WellnessStorage.unenrollChallenge('test-ch-01');
      });

      // 4. Progress Rings & Math Safety
      category('4. Math Edge Cases & Chart Robustness');

      test('Handles zero, NaN, and negative inputs safely without throwing', () => {
        const safeDaily = window.WellnessScoring.calculateDailyScore({ steps: -500, activeMinutes: NaN, water: null, sleep: undefined });
        assertEqual(safeDaily, 0, 'Negative/NaN inputs must yield 0 safely');
      });

      // --- RENDER RESULTS TO DOM ---
      const container = document.getElementById('test-results-container');
      const summaryBox = document.getElementById('test-summary');

      const totalTests = results.length;
      const passedTests = results.filter(r => r.passed).length;
      const failedTests = totalTests - passedTests;

      summaryBox.className = failedTests === 0 ? 'test-summary-box test-pass-bg' : 'test-summary-box test-fail-bg';
      summaryBox.innerHTML = `
        <div>Total Tests: ${totalTests}</div>
        <div>Passed: <span style="color:#059669;">${passedTests}</span></div>
        <div>Failed: <span style="color:#dc2626;">${failedTests}</span></div>
        <div style="margin-left:auto;">${failedTests === 0 ? '✓ ALL SYSTEMS OPERATIONAL' : '✕ TESTS FAILED'}</div>
      `;

      // Group by category
      const categories = [...new Set(results.map(r => r.category))];
      container.innerHTML = categories.map(cat => {
        const catResults = results.filter(r => r.category === cat);
        return `
          <div class="test-cat-title">${cat}</div>
          <div class="card" style="margin-bottom:1rem;">
            ${catResults.map(r => `
              <div class="test-item">
                <div>
                  <strong>${r.description}</strong>
                  ${r.error ? `<div style="color:#b91c1c; font-size:0.8rem; margin-top:2px;">${r.error}</div>` : ''}
                </div>
                <span class="test-status ${r.passed ? 'test-pass' : 'test-fail'}">
                  ${r.passed ? 'PASS' : 'FAIL'}
                </span>
              </div>
            `).join('')}
          </div>
        `;
      }).join('');
    })();
  </script>
</body>
</html>
